experiment:
  name: articulm_v1_50m_tiny_overfit
  seed: 42
  output_dir: runs/articulm_v1_50m_tiny_overfit

model_config: config/model_v1_50m.yaml
data_config: config/data_tiny.yaml

training:
  stage: tiny_overfit
  precision: auto

  tiny_subset:
    num_samples: 64

  optimizer:
    type: adamw
    learning_rate: 1.0e-3
    weight_decay: 0.0

  batching:
    strategy: fixed_samples
    batch_size: 8
    gradient_accumulation_steps: 1

  max_steps: 2000
  gradient_clip_norm: 1.0

  loss:
    viseme:
      type: cross_entropy
      weight: 1.0
      label_smoothing: 0.0
    strength:
      type: smooth_l1
      weight: 1.0
      normalize_target_to_0_1: true

  logging:
    every_steps: 10
