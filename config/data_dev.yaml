# Dev-corpus data config — pipeline exercise only.
#
# Corpus generated by:
#   python scripts/make_dev_corpus.py --num-samples 2000
# Split by:
#   python -m articulm.data.split --config config/data_dev.yaml \
#       --input data/dev/corpus.jsonl
#
# All labels are illustrative pseudo labels, NOT Human Gold. Metrics measured
# on this corpus describe the code path, not model quality.
data:
  schema_version: articulm_v1_sample_v1

  train_path: data/dev/train.jsonl
  validation_path: data/dev/validation.jsonl
  test_path: data/dev/test.jsonl

  max_seq_len: 256

  padding:
    phoneme_pad_token: "[PAD]"
    phoneme_unk_token: "[UNK]"

  language:
    supported: ["zh", "en"]

  chinese:
    surface_tone_values: [1, 2, 3, 4, 5]
    stress_default: 0

  english:
    surface_tone_default: 0
    stress_values: [0, 1, 2]

  labels:
    viseme_classes: 18
    strength_min: 0.0
    strength_max: 100.0

  validation:
    reject_nan_inf: true
    reject_invalid_viseme: true
    reject_invalid_strength: true
    fail_on_schema_mismatch: true

  split:
    train_ratio: 0.90
    validation_ratio: 0.05
    test_ratio: 0.05
    seed: 42
    prevent_near_duplicate_leakage: true
    near_duplicate_jaccard_threshold: 0.8
    near_duplicate_shingle_size: 4
    near_duplicate_sketch_size: 8
    near_duplicate_max_bucket_size: 512
