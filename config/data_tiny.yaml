# Tiny-overfit data config.
#
# Generated by `python scripts/make_tiny_overfit_data.py`.
# All labels are illustrative pseudo labels, NOT Human Gold.
# validation_path deliberately mirrors train_path: the tiny-overfit gate
# measures fitting capacity, not generalisation.
data:
  schema_version: articulm_v1_sample_v1

  train_path: data/tiny/train.jsonl
  validation_path: data/tiny/validation.jsonl
  test_path: null

  max_seq_len: 256

  padding:
    phoneme_pad_token: "[PAD]"
    phoneme_unk_token: "[UNK]"

  language:
    supported: ["zh", "en"]

  chinese:
    surface_tone_values: [1, 2, 3, 4, 5]
    stress_default: 0

  english:
    surface_tone_default: 0
    stress_values: [0, 1, 2]

  labels:
    viseme_classes: 18
    strength_min: 0.0
    strength_max: 100.0

  validation:
    reject_nan_inf: true
    reject_invalid_viseme: true
    reject_invalid_strength: true
    fail_on_schema_mismatch: true

  split:
    train_ratio: 0.90
    validation_ratio: 0.05
    test_ratio: 0.05
    seed: 42
    prevent_near_duplicate_leakage: true
