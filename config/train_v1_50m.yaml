experiment:
  name: articulm_v1_50m_baseline
  seed: 42
  output_dir: runs/articulm_v1_50m_baseline

model_config: config/model_v1_50m.yaml
data_config: config/data_v1.yaml

training:
  stage: synthetic_pretraining
  precision: auto

  # Upper bound only. Real stopping is driven by validation plateau
  # (early_stopping below), per docs/04_training_plan.md.
  max_steps: 200000

  optimizer:
    type: adamw
    learning_rate: 3.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1.0e-8

  scheduler:
    type: cosine
    warmup_ratio: 0.05

  batching:
    strategy: dynamic_phoneme_tokens
    max_phoneme_tokens_per_batch: 6000
    gradient_accumulation_steps: 2

  gradient_clip_norm: 1.0

  loss:
    viseme:
      type: cross_entropy
      weight: 1.0
      label_smoothing: 0.05
    strength:
      type: smooth_l1
      weight: 0.3
      normalize_target_to_0_1: true
      beta: 0.1
      # Per-label-source multipliers applied on top of `weight`.
      # pseudo_strength_v1 is a programmatic prior, NOT Human Gold.
      source_weights:
        pseudo_strength_v1: 1.0
        human: 1.0

  evaluation:
    every_steps: 1000

  checkpoint:
    every_steps: 1000
    save_last: true
    save_best_by: val_viseme_macro_f1
    keep_last_n: 3

  early_stopping:
    enabled: true
    patience_evaluations: 5

  logging:
    every_steps: 50
