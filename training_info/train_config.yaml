stage: synthetic_pretraining
precision: auto
max_steps: 15000
max_epochs: null
tiny_subset:
  num_samples: null
optimizer:
  type: adamw
  learning_rate: 0.0003
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  head_learning_rate: null
scheduler:
  type: cosine
  warmup_ratio: 0.03
  min_lr_ratio: 0.0
batching:
  strategy: dynamic_phoneme_tokens
  batch_size: 8
  max_phoneme_tokens_per_batch: 32000
  gradient_accumulation_steps: 1
  num_workers: 8
  shuffle: true
gradient_clip_norm: 1.0
loss:
  viseme:
    type: cross_entropy
    weight: 1.0
    label_smoothing: 0.05
  strength:
    type: smooth_l1
    weight: 0.3
    normalize_target_to_0_1: true
    beta: 0.1
    source_weights:
      pseudo_strength_v2: 1.0
      human: 1.0
evaluation:
  every_steps: 1000
checkpoint:
  every_steps: 1000
  save_last: true
  save_best_by: val_composite
  keep_last_n: 3
  higher_is_better: true
  best_composite_alpha: 1.0
early_stopping:
  enabled: true
  patience_evaluations: 3
logging:
  every_steps: 100
